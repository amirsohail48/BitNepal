{% extends "base.html" %}
{% load static %}
{%block content%}
  <div class="my-3 mx-3">
    <div class="d-flex">
      <!--Datatable-->
      <div class="col-lg-12">
        <h3 class="text-center">Billing Report</h3>
        <div class="col-2 card mx-1 my-3">
          <div class="my-2">
            <label class="mx-3">From</label>
            <input class="mx-3"type="date">
          </div>
          <div id="datepicker">
            <label class="mx-3">To</label>
            <input class="mx-3" type='date' data-date-format=dd-mm-yyyy/>
          </div>
        </div>
        {{data}}
        <table id="billingreport" class="display">
          <thead>
            <tr>
              <th>DATE</th>
              <th>INVOICE</th>
              <th>ENCOUNTER</th>
              <th>TYPE</th>
              <th>ACCOUNT</th>
              <th>REFERENCE</th>
              <th>SUBTOTAL</th>
              <th>DISCOUNT</th>
              <th>NET TOTAL</th>
              <th>RECEIVED</th>
              <th>DEPOSITE</th>
              <th>USER</th>
              <th>LOCATION</th>
            </tr>
          </thead>
        </table>
      </div>
    </div>
  </div>

{% endblock%}

{% block script %}
<script>
  $(document).ready(function() {
    $('#billingreport').DataTable({
      "processing": true,
      "serverSide": true,
      "ajax": {
        "url": "/api/Tblpatbilldetail/",
        "type": "GET"
      },
      "columns": [
        {"data": "fldtime"},
        {"data": "fldbillno"},
        {"data": "fldencounterval"},
        {"data": "fldbilltype"},
        {"data": "fldbankname"},
        {"data": "fldchequeno"},
        {"data": "flditemamt"},
        {"data": "flddiscountamt"},
        {"data": "fldchargedamt"},
        {"data": "fldreceivedamt"},
        {"data": "fldcurdeposit"},
        {"data": "flduserid"},
        {"data": "fldcomp"}
      ]
    });
  });
</script>
{% endblock script %}
